function form(k, id) {
  const C = CRUD[k],
    L = db(k),
    r = id ? L.find((x) => x.id === id) : {};
  modal(
    "<h3>" + (id ? "Edit " : "Add ") + C.t.slice(0, -1) + '</h3><form class="mf" id="mf" novalidate>' +
      C.f
        .map((f) => {
          const o = f[3] === "courses" ? db("courses").map((c) => c.name) : f[3];
          return (
            '<div class="f"><label for="m-' + f[0] + '">' + f[1] + " *</label>" +
            (f[2] === "select"
              ? '<select id="m-' + f[0] + '">' +
                o.map((x) => "<option" + (r[f[0]] === x ? " selected" : "") + ">" + esc(x) + "</option>").join("") +
                "</select>"
              : '<input id="m-' + f[0] + '" type="' + f[2] + '" value="' + esc(r[f[0]] || "") + '" maxlength="80">') +
            '<small class="er" id="m-e-' + f[0] + '"></small></div>'
          );
        })
        .join("") +
      '<div class="acts"><button class="btn sm" type="submit">Save</button><button class="btn sm ln" type="button" id="mc">Cancel</button></div></form>',
  );
  $("#mc").onclick = close;
  $("#mf").onsubmit = (e) => {
    e.preventDefault();
    let ok = true;
    const d = {};
    C.f.forEach((f) => {
      const el = $("#m-" + f[0]);
      let v = el.value.trim(),
        m = "";
      if (!v) m = "This field is required.";
      else if (
        f[2] === "email" &&
        !/^[A-Za-z0-9._%+\-]+@[A-Za-z0-9\-]+(\.[A-Za-z0-9\-]+)*\.(com|in|org)$/i.test(v)
      )
        m = "Enter a valid .com, .in or .org email.";
      else if (f[0] === "name" && k !== "courses" && !/^[A-Za-z]+(?:[ '\-][A-Za-z]+)*$/.test(v))
        m = "Letters, spaces, hyphens and apostrophes only.";
      else if (f[2] === "number" && +v <= 0) m = "Enter a valid amount.";
      $("#m-e-" + f[0]).textContent = m;
      el.closest(".f").classList.toggle("bad", !!m);
      if (m) ok = false;
      d[f[0]] = f[2] === "number" ? +v : v;
    });
    if (!ok) return;
    if (id)
      Object.assign(
        L.find((x) => x.id === id),
        d,
      );
    else {
      d.id = C.p + (Math.max(100, ...L.map((x) => +String(x.id).replace(/\D/g, "") || 0)) + 1);
      L.push(d);
    }
